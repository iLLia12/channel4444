services:
  app:
    build: .
    container_name: channel4444
    ports:
      - "4444:4444"
    environment:
      - PORT=4444
      # Set this in a .env file next to this file (it's git-ignored).
      - ACCESS_PASSWORD=${ACCESS_PASSWORD:-}
    volumes:
      - channel4444-data:/app/data
    restart: unless-stopped

volumes:
  channel4444-data:
