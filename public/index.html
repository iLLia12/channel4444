<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>channel4444</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">channel<span>4444</span></div>
    <div class="me">
      <span class="status" id="conn-status" title="Connecting…"></span>
      <div id="me-avatar"></div>
      <span id="me-name"></span>
      <a href="/create.html" class="btn ghost small">Edit profile</a>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h2>In video chat <span class="count" id="video-count">0</span></h2>
        <ul class="userlist" id="video-users"></ul>
        <p class="empty" id="video-empty">Nobody in the call</p>
      </section>
      <section>
        <h2>In the app <span class="count" id="online-count">0</span></h2>
        <ul class="userlist" id="online-users"></ul>
      </section>
    </aside>

    <section class="video-panel">
      <div class="video-idle" id="video-idle">
        <div>
          <h2>Video chat</h2>
          <p id="video-idle-text">You can't see or hear the call until you connect.</p>
          <button class="btn primary" id="join-video">Connect to video chat</button>
          <p class="error" id="video-error"></p>
        </div>
      </div>
      <div class="video-live hidden" id="video-live">
        <p class="video-notice hidden" id="video-notice"></p>
        <div class="video-grid" id="video-grid"></div>
        <div class="video-controls">
          <button class="btn" id="toggle-mic">Mute mic</button>
          <button class="btn" id="toggle-cam">Turn camera off</button>
          <button class="btn danger" id="leave-video">Leave</button>
        </div>
      </div>
    </section>

    <section class="chat-panel">
      <h2>Chat</h2>
      <div class="messages" id="messages"></div>
      <form class="composer" id="composer">
        <label class="icon-btn composer-btn" title="Send a photo" aria-label="Send a photo">
          <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><circle cx="5.75" cy="6.5" r="1.1"/><path d="M14 10.5l-3.2-3.2L4 13"/></svg>
          <input type="file" id="photo-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
        </label>
        <textarea id="message-input" rows="1" placeholder="Write a message…" maxlength="4000" autocomplete="off"></textarea>
        <button class="icon-btn composer-btn send-btn" type="submit" id="send-btn" title="Send (Enter)" aria-label="Send" disabled>
          <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor"><path d="M1.7 2.1a.6.6 0 0 1 .8-.7l11.8 6a.7.7 0 0 1 0 1.2l-11.8 6a.6.6 0 0 1-.8-.7L3 8.6h5.3a.6.6 0 0 0 0-1.2H3z"/></svg>
        </button>
      </form>
      <p class="error" id="chat-error"></p>
    </section>
  </main>

  <dialog class="lightbox" id="lightbox" aria-label="Photo">
    <div class="lightbox-bar">
      <div class="lightbox-info" id="lightbox-info"></div>
      <div class="lightbox-actions" id="lightbox-actions"></div>
    </div>
    <div class="lightbox-stage" id="lightbox-stage">
      <img id="lightbox-img" alt="Photo">
    </div>
    <p class="lightbox-caption" id="lightbox-caption"></p>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
