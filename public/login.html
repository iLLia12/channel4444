<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in – channel4444</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="centered">
  <form class="card" id="login-form">
    <div class="brand">channel<span>4444</span></div>
    <h1>Sign in</h1>
    <label class="field">Email
      <input type="email" id="email" required autofocus autocomplete="username">
    </label>
    <label class="field">Password
      <input type="password" id="password" required autocomplete="current-password">
    </label>
    <p class="error" id="login-error"></p>
    <p class="hint">This is a private, invite-only app. Ask the admin for an account.</p>
    <div class="actions"><button class="btn primary" type="submit" id="login-submit">Sign in</button></div>
  </form>
  <script src="/login.js"></script>
</body>
</html>
