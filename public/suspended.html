<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account suspended – channel4444</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="centered">
  <div class="card">
    <div class="brand">channel<span>4444</span></div>
    <h1>Your account is suspended</h1>
    <p class="hint">The admin has suspended your account, so you can't use the chat or video call right now.
      If you think this is a mistake, contact the admin.</p>
    <div class="actions">
      <button class="btn ghost" id="logout">Sign out</button>
      <a href="/" class="btn">Try again</a>
    </div>
  </div>
  <script>
    document.getElementById('logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' });
      location.replace('/login.html');
    });
  </script>
</body>
</html>
